version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    labels: [dependencies]
    # Skip releases younger than 14 days; security updates bypass cooldown.
    cooldown:
      default-days: 14
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    labels: [dependencies]
    # Skip releases younger than 14 days; security updates bypass cooldown.
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    labels: [dependencies]
    # Skip releases younger than 14 days; security updates bypass cooldown.
    cooldown:
      default-days: 14
