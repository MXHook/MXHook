#:schema https://mise.jdx.dev/schema/mise.json
# Developer toolchain. Versions here must match what CI installs:
# Go from go.mod (.github/workflows/build.yml), Node 22, golangci-lint v2.14.0
# (.github/workflows/lint.yml).

[tools]
go = "1.27.3"
node = "22"
"aqua:golangci/golangci-lint" = "2.14.0"
sqlite = "latest"

# No [env] here: `mise exec` would export it to every target, and a
# TEST_DATABASE_URL pointing at a database that is not running turns the
# Postgres-gated tests from skips into failures. Pass it to
# `make test-postgres` explicitly instead.

[tasks.check]
description = "Full local gate (delegates to make)"
run = "make check-all"

[tasks.setup]
description = "Install worker dependencies"
run = "make worker-deps"
